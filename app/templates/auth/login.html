{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="text-center mb-4"><span class="brand-mark large">T</span><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-muted">Sign in to continue to your workspace.</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required maxlength="255" autocomplete="email">
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required autocomplete="current-password">
<div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
<button class="btn btn-primary w-100">Sign in</button></form><p class="text-center mt-4 mb-0 text-muted">New to TaskFlow? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div>{% endblock %}
