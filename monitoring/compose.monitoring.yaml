services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: change-me}
    depends_on: [prometheus]
