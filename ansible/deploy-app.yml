- name: Deploy TaskFlow manifests
  hosts: all
  tasks:
    - name: Apply namespace and non-secret application resources
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ playbook_dir }}/../k8s/{{ item }}"
      loop:
        - namespace.yaml
        - configmap.yaml
        - pvc.yaml
        - postgres.yaml
        - deployment-blue.yaml
        - service.yaml
      changed_when: true
