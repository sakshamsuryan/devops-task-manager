- name: Install Docker Engine on Ubuntu
  hosts: all
  become: true
  tasks:
    - name: Install Docker packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true
    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
