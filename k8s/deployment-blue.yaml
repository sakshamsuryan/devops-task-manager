apiVersion: apps/v1
kind: Deployment
metadata: {name: taskflow-blue, namespace: taskflow}
spec:
  replicas: 2
  selector: {matchLabels: {app: taskflow, track: blue}}
  template:
    metadata: {labels: {app: taskflow, track: blue}}
    spec:
      containers:
      - name: web
        image: taskflow:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 5000}]
        envFrom:
        - configMapRef: {name: taskflow-config}
        - secretRef: {name: taskflow-secret}
        readinessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
